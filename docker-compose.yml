services:
  backend:
    build: ./backend
    image: cflux2-backend:v0.32.0-cu129
    command: >
      vllm serve black-forest-labs/FLUX.1-dev --omni --host 0.0.0.0 --port 8000
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    ports:
      - "8000:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 60
      start_period: 300s

  frontend:
    build: ./frontend
    environment:
      - BACKEND_URL=http://backend:8000
      - MODEL=black-forest-labs/FLUX.1-dev
    ports:
      - "7860:7860"
    depends_on:
      backend:
        condition: service_healthy
